services:
  web:
    build: .
    container_name: weather_web
    ports:
      - "5000:5000"
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - ./sensor_data.db:/app/sensor_data.db
    restart: unless-stopped

  measure:
    build: .
    container_name: weather_measure
    command: python am2320_measure.py
    devices:
      - "/dev/i2c-1:/dev/i2c-1"  
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - ./sensor_data.db:/app/sensor_data.db
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: weather_grafana
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - grafana_data:/var/lib/grafana
      - ./sensor_data.db:/var/lib/grafana/sensor_data.db:ro
      - ./sqlite.yaml:/etc/grafana/provisioning/datasources/sqlite.yaml:ro
    restart: unless-stopped

volumes:
  grafana_data: